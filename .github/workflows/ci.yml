name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20.19.0'
          - '22.x'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: npm }
      - run: npm ci
      # Production tree gates the build; the dev tree is advisory so a vitest
      # advisory cannot wedge every PR on an unrelated change.
      #
      # Moderate rather than high, since the production tree is now at zero and a
      # threshold only holds the line it is set at. It was `high`, and that is exactly
      # how three moderate `qs` advisories sat in the shipped tree while this job
      # reported green: reachable through Express's query parser, so on the request path
      # of every deployment using the Express adapter.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (advisory)
        run: npm audit --audit-level=moderate || true
